{% extends "base.html" %}

{% block title %}库位 · BOMatch{% endblock %}

{% block content %}
<main>
  <nav class="breadcrumb"><a href="/">首页</a><span class="sep">/</span><span class="current">库位</span></nav>
  <div class="page-head"><h2>库位</h2></div>

  <form method="post" action="/locations" class="filters">
    <input type="text" name="name" placeholder="库位名（如 A1-3）" required>
    <input type="text" name="description" placeholder="说明（可选）">
    <button type="submit">新增</button>
  </form>

  <table class="data-table">
    <thead><tr><th>库位</th><th>说明</th><th></th></tr></thead>
    <tbody>
      {% for loc in locations %}
      <tr>
        <td>{{ loc.name }}</td>
        <td>{{ loc.description or "" }}</td>
        <td class="row-actions">
          <form method="post" action="/locations/{{ loc.id }}/delete" class="inline"
                onsubmit="return confirm('删除库位 {{ loc.name }}？')">
            <button type="submit" class="link-danger">删除</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="empty">暂无库位</td></tr>
      {% endfor %}
    </tbody>
  </table>
</main>
{% endblock %}
