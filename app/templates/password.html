{% extends "base.html" %}

{% block title %}修改密码 · BOMatch{% endblock %}

{% block content %}
<main>
  <nav class="breadcrumb"><a href="/">首页</a><span class="sep">/</span><span class="current">修改密码</span></nav>
  <div class="page-head">
    <h2>修改密码</h2>
  </div>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if ok %}<p class="ok">✅ 密码已修改</p>{% endif %}

  <form method="post" action="/password" class="form-grid" data-loading>
    <p><label>当前密码 <input type="password" name="old_password" required autofocus></label></p>
    <p><label>新密码（至少 6 位） <input type="password" name="new_password" required></label></p>
    <p><label>确认新密码 <input type="password" name="confirm_password" required></label></p>
    <p class="full"><button type="submit">修改密码</button></p>
  </form>
</main>
{% endblock %}
