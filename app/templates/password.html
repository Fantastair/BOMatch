{% extends "base.html" %}

{% block title %}账户设置 · BOMatch{% endblock %}

{% block content %}
<main>
  <nav class="breadcrumb"><a href="/">首页</a><span class="sep">/</span><span class="current">账户设置</span></nav>
  <div class="page-head">
    <h2>账户设置</h2>
  </div>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if ok %}<p class="ok">✅ {{ ok }}</p>{% endif %}

  <h3>用户名</h3>
  <form method="post" action="/account/username" class="form-grid" data-loading>
    <p><label>当前用户名 <input type="text" value="{{ user }}" disabled></label></p>
    <p><label>新用户名 * <input type="text" name="new_username" value="{{ username_value or '' }}" required maxlength="64"></label></p>
    <p><label>当前密码（验证身份） <input type="password" name="password" required></label></p>
    <p class="full"><button type="submit">更新用户名</button></p>
  </form>

  <h3>密码</h3>
  <form method="post" action="/password" class="form-grid" data-loading>
    <p><label>当前密码 <input type="password" name="old_password" required></label></p>
    <p><label>新密码（至少 6 位） <input type="password" name="new_password" required></label></p>
    <p><label>确认新密码 <input type="password" name="confirm_password" required></label></p>
    <p class="full"><button type="submit">修改密码</button></p>
  </form>
</main>
{% endblock %}
