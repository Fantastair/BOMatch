<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BOMatch{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    {% if user %}
    <header class="topbar">
      <h1><a href="/" class="brand">BOMatch</a></h1>
      <nav id="top-nav">
        {% set p = request.url.path %}
        <a href="/projects" class="{{ 'active' if p.startswith('/projects') else '' }}">项目</a>
        <a href="/stock" class="{{ 'active' if p.startswith('/stock') else '' }}">库存</a>
        <a href="/parts" class="{{ 'active' if p.startswith('/parts') else '' }}">料号</a>
        <a href="/categories" class="{{ 'active' if p.startswith('/categories') else '' }}">类别</a>
        <a href="/locations" class="{{ 'active' if p.startswith('/locations') else '' }}">库位</a>
      </nav>
      <div class="nav-actions">
        <div class="user-menu" id="user-menu">
          <button class="user-menu-toggle" id="user-menu-toggle" type="button" aria-expanded="false" aria-haspopup="true">
            <span>👤 {{ user }}</span><span class="caret">▾</span>
          </button>
          <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
            <a href="/password">账户设置</a>
            <div class="dropdown-divider"></div>
            <form method="post" action="/logout" data-loading>
              <button type="submit" class="dropdown-item">退出登录</button>
            </form>
          </div>
        </div>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="菜单" aria-expanded="false">☰</button>
      </div>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
    <button class="back-to-top" type="button" aria-label="返回顶部">↑</button>
    <script src="/static/app.js"></script>
  </body>
</html>
