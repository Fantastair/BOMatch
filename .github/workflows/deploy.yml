# BOMatch 自动部署工作流
# 触发：push 到 master/main 或手动触发（workflow_dispatch）
# 作用：通过 SSH 登录生产服务器，拉取最新代码并重启服务
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#   SERVER_HOST    服务器公网 IP（如 8.152.101.207）
#   SERVER_PORT    SSH 端口（默认 22）
#   SERVER_USER    SSH 用户（如 fanagent）
#   SERVER_SSH_KEY 部署用 SSH 私钥（与服务器 authorized_keys 配对）

name: 部署 BOMatch

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH 部署到生产服务器
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 在服务器上更新部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash /opt/bomatch/deploy/update.sh
