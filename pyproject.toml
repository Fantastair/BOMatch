[project]
name = "bomatch"
version = "1.0.0"
description = "BOMatch - 个人电子元件物料管理系统"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
    "typer>=0.27.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# 精简规则集：经典默认（pycodestyle 部分 + pyflakes）+ isort，不做严格风格限制
select = ["E4", "E7", "E9", "F", "I"]
